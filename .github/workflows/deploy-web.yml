# Veröffentlicht die Web-Version auf GitHub Pages.
#
# Einmalig aktivieren: Repository → Settings → Pages → Source: "GitHub Actions".
# Danach diesen Workflow über den "Run workflow"-Knopf starten (oder auf den
# Standard-Branch pushen). Die App ist anschließend erreichbar unter:
#   https://<benutzername>.github.io/<repository-name>/
name: Web-Version veröffentlichen (GitHub Pages)

on:
  push:
    branches:
      - main
      - master
      # Aktueller Default-Branch dieses Repositories:
      - claude/image-generator-text-descriptions-hxsqas
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deployment
        uses: actions/deploy-pages@v4
