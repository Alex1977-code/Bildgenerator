name: Build

on:
  push:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.2

jobs:
  test:
    name: Analyse & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android-APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=BUILD_INFO="${GITHUB_SHA:0:7} · $(date -u +%d.%m.%Y) UTC"
      - name: APK als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: bildgenerator-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  windows:
    name: Windows-App
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # bash auch auf dem Windows-Runner: die Shell-Substitutionen für
      # BUILD_INFO sind Bash-Syntax.
      - run: flutter build windows --release --dart-define=BUILD_INFO="${GITHUB_SHA:0:7} · $(date -u +%d.%m.%Y) UTC"
        shell: bash
      - name: Windows-Build als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: bildgenerator-windows
          path: build/windows/x64/runner/Release
          retention-days: 30

  web:
    name: Web-App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --dart-define=BUILD_INFO="${GITHUB_SHA:0:7} · $(date -u +%d.%m.%Y) UTC"
      - name: Web-Build als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: bildgenerator-web
          path: build/web
          retention-days: 30

  # Aktualisiert das Release "Aktuelle Version" mit festen Download-Links:
  #   https://github.com/<owner>/<repo>/releases/latest/download/bildgenerator-windows.zip
  #   https://github.com/<owner>/<repo>/releases/latest/download/bildgenerator-android.apk
  release:
    name: Release aktualisieren
    needs: [test, android, windows, web]
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Dateien für das Release packen
        run: |
          (cd artifacts/bildgenerator-windows && zip -qr ../../bildgenerator-windows.zip .)
          cp artifacts/bildgenerator-android-apk/app-release.apk bildgenerator-android.apk
          (cd artifacts/bildgenerator-web && zip -qr ../../bildgenerator-web.zip .)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Aktuelle Version
          body: |
            Automatisch aktualisierter Build des neuesten Stands.

            - **bildgenerator-windows.zip** – Windows: entpacken und `bildgenerator.exe` starten
            - **bildgenerator-android.apk** – Android: herunterladen und installieren
            - **bildgenerator-web.zip** – Web-Version zum Selbst-Hosten

            Die Web-App läuft außerdem live unter
            https://alex1977-code.github.io/Bildgenerator/
          files: |
            bildgenerator-windows.zip
            bildgenerator-android.apk
            bildgenerator-web.zip
