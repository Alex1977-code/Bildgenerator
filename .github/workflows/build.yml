name: Build

on:
  push:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.2

jobs:
  test:
    name: Analyse & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android-APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - name: APK als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: bildgenerator-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  windows:
    name: Windows-App
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Windows-Build als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: bildgenerator-windows
          path: build/windows/x64/runner/Release
          retention-days: 30

  web:
    name: Web-App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build web --release
      - name: Web-Build als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: bildgenerator-web
          path: build/web
          retention-days: 30
